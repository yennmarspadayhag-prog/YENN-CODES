<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Components</title>
<style>
    .container {
        display: grid;
        height: 500px;
        width: 500px;
        grid-template-columns: auto auto auto;
        grid-template-rows: auto auto auto;
        grid-template-areas:
        "item1 item1 item1 item1 item1 item1"   
        "item2 item2 item2 item3 item3 item3"
        "item4 item4 item5 item5 item6 item6";
        gap: 5px;
        padding: 5px;        
    }
    .container div {
        border: 3px solid black;
    }
    
    #item1 {
        grid-area: item1;
        background-color: red;
    }
    #item2 {
        grid-area: item2;
        background-color: blue;
     
    }
    #item3 {
        grid-area: item3;
        background-color: green;
        
    }
    #item4 {
        grid-area: item4;
        background-color: brown;
       
    }
    #item5 {
        grid-area: item5;
        background-color: violet;
        
    }
    #item6 {
        grid-area: item6;
        background-color: aqua;
       
    }

</style>
</head>
<body>
    <div class="container ">
        <div id="item1">1</div>
        <div id="item2">2</div>
        <div id="item3">3</div>
        <div id="item4">4</div>
        <div id="item5">5</div>
        <div id="item6">6</div>  
    </div>
</body>
</html>
