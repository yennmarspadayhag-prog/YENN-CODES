   }
   input,
   textarea {
    width: 90%;
    background-color: transparent;
    outline: none;
    border: 1px solid rgb(250, 250, 250);
    border-radius: 5px;
    padding: 10px;
   }
   .form-container > form > * {
    margin-bottom: 5px;
   }
   input[type="text"],
   input[type="number"],
   input[type="email"],

   } 
   input:focus {

   }

   }

</style>
</head>
